<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GrokSlop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="tabs" aria-label="GrokSlop">
        <span class="tabs-mark">GrokSlop</span>
        <a href="/">Controls</a>
        <a href="/queue" aria-current="page">Queue</a>
        <a href="/soundboard">Soundboard</a>
    </nav>
    <header class="top">
        <p id="tagline" class="tagline">Queue</p>
        <div id="presence" class="presence offline">Offline</div>
        <div class="selectors">
            <label>Server
                <select id="guild"></select>
            </label>
            <label>Text channel
                <select id="textChannel"></select>
            </label>
            <label>Voice channel
                <select id="voiceChannel"></select>
            </label>
        </div>
    </header>

    <p id="situation" class="situation">Pick a server. Add joins the selected voice channel if he is not already in one.</p>
    <pre id="result" class="result" aria-live="polite">Ready.</pre>

    <main class="sound-main">
        <section class="now" aria-label="Now playing">
            <h3 id="nowTitle">Nothing queued</h3>
            <input id="scrub" class="scrub" type="range" min="0" max="1000" value="0" step="1000" aria-label="Song position">
            <div class="transport">
                <button type="button" id="toggle" class="icon" data-mode="play" title="Play" aria-label="Play">
                    <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.4v11.2l10-5.6z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 2.2h3.1v11.6H3.2zM9.7 2.2h3.1v11.6H9.7z"/></svg>
                </button>
                <button type="button" id="stop" class="icon active" title="Stop" aria-label="Stop" aria-pressed="true">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.4" y="3.4" width="9.2" height="9.2"/></svg>
                </button>
                <button type="button" id="previous" class="icon" title="Previous" aria-label="Previous">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.6h1.7v10.8H2zM8.2 2.4 3.6 8l4.6 5.6zM14.2 2.4 9.6 8l4.6 5.6z"/></svg>
                </button>
                <button type="button" id="back" class="icon" title="Rewind 10 seconds" aria-label="Rewind 10 seconds">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.4 2.4 3.6 8l4.8 5.6zM14.4 2.4 9.6 8l4.8 5.6z"/></svg>
                </button>
                <button type="button" id="forward" class="icon" title="Fast forward 10 seconds" aria-label="Fast forward 10 seconds">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 2.4 6.4 8l-4.8 5.6zM7.6 2.4 12.4 8 7.6 13.6z"/></svg>
                </button>
                <button type="button" id="skip" class="icon" title="Next" aria-label="Next">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 2.4 6.4 8l-4.6 5.6zM7.8 2.4 12.4 8 7.8 13.6zM14 2.6h1.7v10.8H14z"/></svg>
                </button>
                <span class="transport-gap"></span>
                <label class="player-volume">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M1.8 6.1h2.3L7.6 3.2v9.6L4.1 9.9H1.8z"/>
                        <path d="M9.4 6a2.6 2.6 0 0 1 0 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        <path d="M11 4.4a4.6 4.6 0 0 1 0 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                    <input id="volume" type="range" min="0" max="100" step="5" value="100" aria-label="Volume">
                </label>
            </div>
            <div class="player-status">
                <span id="playState">Stopped</span>
                <span id="clock">00:00 / 00:00</span>
            </div>
        </section>

        <section class="composer">
            <h2>Add to queue</h2>
            <div class="composer-row add-row">
                <label class="grow">Link, playlist, or search
                    <input id="query" type="text" maxlength="500" placeholder="URL, playlist, or search">
                </label>
                <button type="button" id="add">Add</button>
            </div>
        </section>

        <div id="queueList" class="queue-list"></div>
    </main>

    <script src="/selectors.js"></script>
    <script src="/queue.js"></script>
</body>
</html>
